name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: pytest -q

  build:
    name: build distributions
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Pack the Claude Desktop bundle
        run: |
          mkdir -p bundle
          npx --yes @anthropic-ai/mcpb@latest pack mcpb bundle/google-search-console.mcpb
      # Two artifacts on purpose: PyPI rejects anything in the upload directory
      # that is not a wheel or an sdist.
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: mcpb-bundle
          path: bundle/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: create the GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: release-files/
      - uses: actions/download-artifact@v4
        with:
          name: mcpb-bundle
          path: release-files/
      - name: Extract the CHANGELOG section for this tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG section for $VERSION" > release-notes.md
          fi
          cat release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          # The wheel, the sdist and the .mcpb bundle the README points people at.
          files: release-files/*
