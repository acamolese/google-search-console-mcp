[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-google-search-console"
version = "3.0.0"
description = "MCP server for Google Search Console: query performance data, inspect URLs, check indexing, and generate HTML SEO audit reports from Claude, Cursor, Zed, and any Model Context Protocol client."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Andrea Camolese" },
]
keywords = [
    "mcp",
    "model-context-protocol",
    "google-search-console",
    "gsc",
    "search-console-api",
    "webmaster-tools",
    "seo",
    "seo-audit",
    "seo-tools",
    "seo-automation",
    "seo-reports",
    "claude",
    "claude-code",
    "claude-desktop",
    "cursor",
    "zed",
    "anthropic",
    "llm-tools",
    "ai-tools",
    "report-generator",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing :: Markup :: HTML",
]
dependencies = [
    "mcp>=1.12,<3",
    "httpx>=0.27",
    "pydantic>=2.0",
    "google-auth>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
    "requests>=2.31",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "freezegun>=1.5",
    "ruff>=0.5",
    "mypy>=1.10",
    "build>=1.2",
]

[project.urls]
Homepage = "https://github.com/acamolese/google-search-console-mcp"
Repository = "https://github.com/acamolese/google-search-console-mcp"
Issues = "https://github.com/acamolese/google-search-console-mcp/issues"
Documentation = "https://github.com/acamolese/google-search-console-mcp#readme"
"Release notes" = "https://github.com/acamolese/google-search-console-mcp/releases"
PyPI = "https://pypi.org/project/mcp-google-search-console/"

[project.scripts]
mcp-google-search-console = "google_search_console_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/google_search_console_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "src/google_search_console_mcp/**",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "DTZ", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
# audit.py still carries the hardcoded Italian report copy; those long literals move
# into i18n/it.json in 3.0.0 and this exemption goes away with them.
"src/google_search_console_mcp/audit.py" = ["E501"]
# S101 asserts, S105/S106 fake secrets, DTZ001 naive datetimes are the subject under
# test, S104 is a bind address passed to a fake server.
"tests/**" = ["S101", "S104", "S105", "S106", "S107", "DTZ001"]
"scripts/**" = ["S101", "T201"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: hits the real Google API; requires GSC_LIVE_TESTS=1 and credentials",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["google_search_console_mcp"]
omit = [
    # Both need a terminal or a browser; they are covered by subprocess tests instead.
    "*/__main__.py",
    "*/auth/oauth.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
